name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to release
        type: choice
        required: true
        options:
          - patch
          - minor
          - major
          - current

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Publish crate
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: Production
    outputs:
      crate_name: ${{ steps.version.outputs.crate_name }}
      next_version: ${{ steps.version.outputs.next_version }}
      tag: ${{ steps.version.outputs.tag }}
      tinybus_version: ${{ steps.version.outputs.tinybus_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Require 90% line coverage in every source file
        run: .github/scripts/check-file-coverage.sh 90 target/coverage.json

      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

      - name: Compute next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          metadata="$(cargo metadata --format-version 1 --no-deps)"
          crate_name="$(jq -r '.packages[0].name' <<< "$metadata")"
          current_version="$(jq -r '.packages[0].version' <<< "$metadata")"
          tinybus_version="$(
            cargo metadata \
              --manifest-path vendor/tinybus/Cargo.toml \
              --format-version 1 \
              --no-deps \
              | jq -r '.packages[] | select(.name == "tinybus") | .version'
          )"
          if [[ -z "$current_version" || "$current_version" == "null" ]]; then
            echo "Could not resolve the current crate version" >&2
            exit 1
          fi
          if [[ -z "$tinybus_version" || "$tinybus_version" == "null" ]]; then
            echo "Could not resolve the TinyBus version" >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$current_version"
          case "${{ inputs.bump }}" in
            current)
              ;;
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
            *)
              echo "Unsupported bump: ${{ inputs.bump }}" >&2
              exit 1
              ;;
          esac

          next_version="${major}.${minor}.${patch}"
          tag="v${next_version}"

          git fetch --tags origin
          if git rev-parse --verify --quiet "refs/tags/${tag}"; then
            if [[ "${{ inputs.bump }}" != "current" ]]; then
              echo "Tag ${tag} already exists" >&2
              exit 1
            fi
            tagged_version="$(
              git show "${tag}:Cargo.toml" \
                | sed -n 's/^version = "\([^"]*\)"/\1/p' \
                | head -n 1
            )"
            if [[ "$tagged_version" != "$current_version" ]]; then
              echo "Tag ${tag} does not contain version ${current_version}" >&2
              exit 1
            fi
          fi

          {
            echo "crate_name=${crate_name}"
            echo "current_version=${current_version}"
            echo "next_version=${next_version}"
            echo "tag=${tag}"
            echo "tinybus_version=${tinybus_version}"
          } >> "$GITHUB_OUTPUT"

      - name: Update crate version
        if: ${{ inputs.bump != 'current' }}
        env:
          CRATE_NAME: ${{ steps.version.outputs.crate_name }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          set -euo pipefail
          perl -0pi -e 's/(\[package\][\s\S]*?\nversion = ")[^"]+(")/$1$ENV{NEXT_VERSION}$2/' Cargo.toml
          cargo update -p "$CRATE_NAME" --precise "$NEXT_VERSION"

      - name: Commit version bump and tag
        if: ${{ inputs.bump != 'current' }}
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "Release ${RELEASE_TAG}"
          git tag -a "${RELEASE_TAG}" -m "Release ${RELEASE_TAG}"

      - name: Package crate
        run: cargo package --locked

      - name: Package TinyBus source and module SDK
        run: |
          set -euo pipefail
          tinybus_revision="$(git -C vendor/tinybus rev-parse --short=12 HEAD)"
          git -C vendor/tinybus archive \
            --format=tar.gz \
            --prefix="tinybus-${tinybus_revision}/" \
            --output="$PWD/target/package/tinybus-source-${tinybus_revision}.tar.gz" \
            HEAD

      - name: Upload source packages
        uses: actions/upload-artifact@v4
        with:
          name: source-packages
          path: |
            target/package/${{ steps.version.outputs.crate_name }}-${{ steps.version.outputs.next_version }}.crate
            target/package/tinybus-source-*.tar.gz
          if-no-files-found: error

      - name: Push release commit and tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git push origin "HEAD:${GITHUB_REF_NAME}"
          git push origin "${RELEASE_TAG}"

      - name: Check crates.io credentials
        id: crates_io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [[ -n "$CARGO_REGISTRY_TOKEN" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "### crates.io publication skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "The Production environment has no CARGO_REGISTRY_TOKEN." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publish to crates.io
        if: ${{ steps.crates_io.outputs.configured == 'true' }}
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  tinybus-bundles:
    name: TinyBus bundle (${{ matrix.id }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: ubuntu-22.04-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - id: ubuntu-22.04-arm64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - id: ubuntu-24.04-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - id: ubuntu-24.04-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - id: macos-15-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
          - id: macos-15-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - id: macos-26-x86_64
            os: macos-26-intel
            target: x86_64-apple-darwin
          - id: macos-26-arm64
            os: macos-26
            target: aarch64-apple-darwin
          - id: windows-2022-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - id: windows-2025-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - id: windows-11-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.tag }}
          persist-credentials: false
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: vendor/tinybus -> target

      - name: Verify native Rust target
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          actual_target="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$actual_target" != "$EXPECTED_TARGET" ]]; then
            echo "expected ${EXPECTED_TARGET}, got ${actual_target}" >&2
            exit 1
          fi

      - name: Build TinyBus CLI and loadable modules
        if: ${{ runner.os != 'Windows' }}
        working-directory: vendor/tinybus
        run: >-
          cargo build --locked --release --package tinybus --all-features
          --bin tinybus --example module_clock --example module_clock_two

      - name: Build TinyBus library and loadable modules
        if: ${{ runner.os == 'Windows' }}
        working-directory: vendor/tinybus
        run: >-
          cargo build --locked --release --package tinybus
          --no-default-features --features modules,macros
          --example module_clock --example module_clock_two

      - name: Assemble Unix bundle
        if: ${{ runner.os != 'Windows' }}
        id: bundle_unix
        shell: bash
        env:
          BUNDLE_ID: ${{ matrix.id }}
          TINYBUS_VERSION: ${{ needs.publish.outputs.tinybus_version }}
        run: |
          set -euo pipefail

          bundle_name="tinybus-${TINYBUS_VERSION}-${BUNDLE_ID}"
          bundle_root="dist/${bundle_name}"
          module_root="${bundle_root}/modules"
          mkdir -p "${bundle_root}/bin" "$module_root" "${bundle_root}/docs"

          install -m 755 vendor/tinybus/target/release/tinybus "${bundle_root}/bin/tinybus"

          module_clock="$(find vendor/tinybus/target/release/examples -maxdepth 1 -type f \( -name 'libmodule_clock.so' -o -name 'libmodule_clock.dylib' \) -print -quit)"
          module_clock_two="$(find vendor/tinybus/target/release/examples -maxdepth 1 -type f \( -name 'libmodule_clock_two.so' -o -name 'libmodule_clock_two.dylib' \) -print -quit)"
          for module in "$module_clock" "$module_clock_two"; do
            if [[ -z "$module" || ! -f "$module" ]]; then
              echo "a TinyBus module artifact is missing" >&2
              exit 1
            fi
            install -m 644 "$module" "$module_root/"
          done

          : > "${module_root}/modules.toml"
          for module in \
            "${module_root}/$(basename "$module_clock")" \
            "${module_root}/$(basename "$module_clock_two")"; do
            module_name="$(basename "$module")"
            module_hash="$(shasum -a 256 "$module" | awk '{print $1}')"
            printf '"%s" = "%s"\n' "$module_name" "$module_hash" >> "${module_root}/modules.toml"
          done

          install -m 644 vendor/tinybus/LICENSE "${bundle_root}/LICENSE"
          install -m 644 vendor/tinybus/README.md "${bundle_root}/README.md"
          install -m 644 vendor/tinybus/docs/protocol.md "${bundle_root}/docs/protocol.md"
          cp -R vendor/tinybus/docs/modules "${bundle_root}/docs/modules"

          tar -C dist -czf "dist/${bundle_name}.tar.gz" "$bundle_name"
          echo "archive=dist/${bundle_name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Assemble Windows bundle
        if: ${{ runner.os == 'Windows' }}
        id: bundle_windows
        shell: pwsh
        env:
          BUNDLE_ID: ${{ matrix.id }}
          TINYBUS_VERSION: ${{ needs.publish.outputs.tinybus_version }}
        run: |
          $ErrorActionPreference = 'Stop'

          $bundleName = "tinybus-$env:TINYBUS_VERSION-$env:BUNDLE_ID"
          $bundleRoot = "dist/$bundleName"
          $moduleRoot = "$bundleRoot/modules"
          New-Item -ItemType Directory -Force $moduleRoot, "$bundleRoot/docs" | Out-Null

          $moduleClock = 'vendor/tinybus/target/release/examples/module_clock.dll'
          $moduleClockTwo = 'vendor/tinybus/target/release/examples/module_clock_two.dll'
          foreach ($module in @($moduleClock, $moduleClockTwo)) {
            if (-not (Test-Path -LiteralPath $module -PathType Leaf)) {
              throw "a TinyBus module artifact is missing: $module"
            }
            Copy-Item -LiteralPath $module -Destination $moduleRoot
          }

          $allowlist = foreach ($module in Get-ChildItem -LiteralPath $moduleRoot -Filter '*.dll') {
            $hash = (Get-FileHash -LiteralPath $module.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            '"{0}" = "{1}"' -f $module.Name, $hash
          }
          $utf8 = [System.Text.UTF8Encoding]::new($false)
          [System.IO.File]::WriteAllLines("$moduleRoot/modules.toml", $allowlist, $utf8)

          Copy-Item -LiteralPath @(
            'vendor/tinybus/LICENSE',
            'vendor/tinybus/README.md'
          ) -Destination $bundleRoot
          Copy-Item -LiteralPath 'vendor/tinybus/docs/protocol.md' -Destination "$bundleRoot/docs"
          Copy-Item -LiteralPath 'vendor/tinybus/docs/modules' -Destination "$bundleRoot/docs/modules" -Recurse
          $windowsNote = @(
            'TinyBus Windows module bundle',
            '',
            'This bundle contains the in-process module DLLs and SHA-256 allowlist.',
            'The TinyBus CLI is not included because its production transport uses',
            'Unix-domain sockets; Windows named-pipe support is not implemented yet.'
          )
          [System.IO.File]::WriteAllLines("$bundleRoot/WINDOWS.md", $windowsNote, $utf8)

          $archive = "dist/$bundleName.zip"
          Compress-Archive -Path $bundleRoot -DestinationPath $archive
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload Unix bundle
        if: ${{ runner.os != 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: tinybus-${{ matrix.id }}
          path: ${{ steps.bundle_unix.outputs.archive }}
          if-no-files-found: error

      - name: Upload Windows bundle
        if: ${{ runner.os == 'Windows' }}
        uses: actions/upload-artifact@v4
        with:
          name: tinybus-${{ matrix.id }}
          path: ${{ steps.bundle_windows.outputs.archive }}
          if-no-files-found: error

  linux-distro-bundles:
    name: TinyBus bundle (${{ matrix.id }})
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: fedora-43-x86_64
            os: ubuntu-24.04
            container: fedora:43
            target: x86_64-unknown-linux-gnu
            family: fedora
          - id: fedora-43-arm64
            os: ubuntu-24.04-arm
            container: fedora:43
            target: aarch64-unknown-linux-gnu
            family: fedora
          - id: fedora-44-x86_64
            os: ubuntu-24.04
            container: fedora:44
            target: x86_64-unknown-linux-gnu
            family: fedora
          - id: fedora-44-arm64
            os: ubuntu-24.04-arm
            container: fedora:44
            target: aarch64-unknown-linux-gnu
            family: fedora
          - id: archlinux-rolling-x86_64
            os: ubuntu-24.04
            container: archlinux:base-devel
            target: x86_64-unknown-linux-gnu
            family: archlinux
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install Fedora build tools
        if: ${{ matrix.family == 'fedora' }}
        run: dnf install -y findutils gcc git gzip make perl tar

      - name: Install Arch Linux build tools
        if: ${{ matrix.family == 'archlinux' }}
        run: pacman -Syu --noconfirm base-devel git

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.publish.outputs.tag }}
          persist-credentials: false
          submodules: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify native Rust target
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          actual_target="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$actual_target" != "$EXPECTED_TARGET" ]]; then
            echo "expected ${EXPECTED_TARGET}, got ${actual_target}" >&2
            exit 1
          fi

      - name: Build TinyBus CLI and loadable modules
        working-directory: vendor/tinybus
        run: >-
          cargo build --locked --release --package tinybus --all-features
          --bin tinybus --example module_clock --example module_clock_two

      - name: Assemble distro bundle
        id: bundle
        env:
          BUNDLE_ID: ${{ matrix.id }}
          TINYBUS_VERSION: ${{ needs.publish.outputs.tinybus_version }}
        run: |
          set -euo pipefail

          bundle_name="tinybus-${TINYBUS_VERSION}-${BUNDLE_ID}"
          bundle_root="dist/${bundle_name}"
          module_root="${bundle_root}/modules"
          mkdir -p "${bundle_root}/bin" "$module_root" "${bundle_root}/docs"

          install -m 755 vendor/tinybus/target/release/tinybus "${bundle_root}/bin/tinybus"

          module_clock="$(find vendor/tinybus/target/release/examples -maxdepth 1 -type f -name 'libmodule_clock.so' -print -quit)"
          module_clock_two="$(find vendor/tinybus/target/release/examples -maxdepth 1 -type f -name 'libmodule_clock_two.so' -print -quit)"
          for module in "$module_clock" "$module_clock_two"; do
            if [[ -z "$module" || ! -f "$module" ]]; then
              echo "a TinyBus module artifact is missing" >&2
              exit 1
            fi
            install -m 644 "$module" "$module_root/"
          done

          : > "${module_root}/modules.toml"
          for module in \
            "${module_root}/$(basename "$module_clock")" \
            "${module_root}/$(basename "$module_clock_two")"; do
            module_name="$(basename "$module")"
            module_hash="$(sha256sum "$module" | awk '{print $1}')"
            printf '"%s" = "%s"\n' "$module_name" "$module_hash" >> "${module_root}/modules.toml"
          done

          install -m 644 vendor/tinybus/LICENSE "${bundle_root}/LICENSE"
          install -m 644 vendor/tinybus/README.md "${bundle_root}/README.md"
          install -m 644 vendor/tinybus/docs/protocol.md "${bundle_root}/docs/protocol.md"
          cp -R vendor/tinybus/docs/modules "${bundle_root}/docs/modules"

          tar -C dist -czf "dist/${bundle_name}.tar.gz" "$bundle_name"
          echo "archive=dist/${bundle_name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload distro bundle
        uses: actions/upload-artifact@v4
        with:
          name: tinybus-${{ matrix.id }}
          path: ${{ steps.bundle.outputs.archive }}
          if-no-files-found: error

  github-release:
    name: Create GitHub release
    needs:
      - publish
      - tinybus-bundles
      - linux-distro-bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: release-assets
          merge-multiple: true

      - name: Create or update release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.publish.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; immutable assets are unchanged."
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$REPOSITORY" \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
